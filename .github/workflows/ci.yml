# CI. Owner: integrator, written at task I-5.
#
# Two jobs: the solution builds and every test project runs, and the Terraform roots validate.
#
# Check A-05 is deliberately not here. It lives in .githooks/pre-push, where it catches a session
# that reached outside its brief at the moment it reached. A blocking CI check would need an
# override for the integrator's own cross-owner work, and an override nobody can verify -- one
# author, one reviewer -- is a permissions model for a team of one.
#
# Two jobs are deliberately partial on the skeleton and say so when they are: the plan policy
# (P-01 to P-03) needs the read-only AWS role task 1.0 creates and the allowlist task 1.9 writes,
# and neither exists yet. They skip with a notice rather than passing silently.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # For the AWS plan role, once task 1.9 wires it.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag. The roadmap check below derives how far the work has
          # got from the tags and the merge subjects, and the default depth-1 checkout has neither.
          fetch-depth: 0

      - name: The documents a session steers by say what the repository says
        # Before the build, because it costs a second and a stale AGENTS.md misleads every session
        # from the top of its context window. Every rule it holds was prose first, and prose let
        # a progress line sit directly under the paragraph forbidding it for two sessions running.
        # It covers the two steering files and the contracts index, whose freeze column makes a
        # claim about a file two directories away.
        # The tests run first, on trees built to trip each rule, because the repository is green and
        # a green repository cannot show that a widened check stopped catching what it was for.
        run: |
          python3 -I .github/steering_tests.py
          python3 -I .github/steering.py

      - name: Plan generation stays disabled until its private pipeline is reviewed
        # A plan's `after` holds the values the apply will write, so the identity root's plan
        # carries every generated test-user password and the apps root's carries the OAuth client
        # secrets. Change request 1.1's first half put *.tfplan in .gitignore; this is its second
        # half, and it is a check rather than a sentence because the sentence is what task 1.9
        # would read last. It starts green: nothing here uploads an artifact or writes a plan yet.
        run: |
          python3 -I .github/plan-secrecy-tests.py
          python3 -I .github/plan-secrecy.py

      - name: The roadmap says what the tags, the merges and the plan say
        # docs/roadmap.md carries the gateway's capability ladder and a generated block saying how
        # far along it the work has got. The block is derived, and this is what keeps it derived: it
        # fails when the block is not what the repository says, and when the ladder stops covering
        # every plan row exactly once. Beside the steering check for the same reason -- a document
        # that states progress is a document that will state it wrongly.
        run: |
          python3 -I tools/roadmap_tests.py
          python3 -I tools/roadmap.py --check

      - name: A-05's two rules hold
        # The ownership check is the one guard with no CI job of its own: it runs in the pre-push
        # hook, where a failure costs an amended commit instead of a red pull request. Its rules
        # are still worth a test, because the second one -- every commit single-owner, on a branch
        # that merged something -- is the rule that decides whether an integration branch can be
        # pushed through the hook at all rather than around it.
        run: python3 -I .github/path_ownership_tests.py

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Package versions are central, so one key covers the whole solution.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        # Warnings are errors, set in Directory.Build.props. Package advisories warn (NU1901-NU1904).
        run: dotnet build --configuration Release

      - name: Tests
        # Every test project in the solution: the component tests, the hermetic gateway suites and
        # the architecture tests A-01 to A-04. They are one step because the whole suite runs in
        # seconds; split it per tier when workstream 6's suites make that worth separate signal.
        #
        # A test project with no tests exits 8 on Microsoft Testing Platform. On the skeleton most of
        # them have none, so 8 is suppressed. It stops being suppressed when it stops being normal.
        #
        # --no-build: the Build step above already built Release, and a second evaluation buys nothing.
        run: dotnet test --solution SpaPlatform.slnx --configuration Release --no-build --ignore-exit-code 8

      - name: The gateway starts and answers 404 to an unknown host
        # G1a's exit test, and nothing else here proves it: the suite never starts the gateway, so a
        # composition root that throws, or a settings file the configuration binder rejects, builds
        # and tests clean. Both have happened.
        #
        # The script holds the probes, so a local run and this one are the same test.
        run: tools/smoke.sh Release 5080

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # 1.11 is the floor: that release gave the S3 backend its native lock file, which is why
          # no DynamoDB table exists anywhere in this platform.
          terraform_version: 1.11.0
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Validate every root
        # A root is any directory holding .tf files. Discovered rather than listed, so the roots
        # tasks 1.1 to 1.5 and 1.8 add are validated the day they land.
        #
        # -backend=false: validation needs no state and no credentials.
        run: |
          set -euo pipefail
          roots=$(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$roots" ]; then
            echo "::error::no Terraform roots found under infra/"
            exit 1
          fi
          for root in $roots; do
            echo "--- $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Test every root and module with tests under infra/
        # Terraform loads *.tftest.hcl beside the configuration or in its tests/ directory:
        # https://developer.hashicorp.com/terraform/language/tests#test-directory
        # These tests use mock providers, so they need no credentials. Without this step those
        # runs are evidence from whichever machine wrote them.
        run: |
          set -euo pipefail
          dirs=$(find infra -type f -name '*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; \
            | while IFS= read -r parent; do
                if [ "$(basename "$parent")" = tests ]; then
                  dirname "$parent"
                else
                  printf '%s\n' "$parent"
                fi
              done | sort -u)
          if [ -z "$dirs" ]; then
            echo "::error::no Terraform test roots found under infra/"
            exit 1
          fi
          while IFS= read -r dir; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
          done <<< "$dirs"

      - name: Plan policy (P-01 to P-03)
        # The allowlist of resource types and counts, plus the assertions on the two security groups
        # and the task role. Task 1.9 writes it at tools/scripts/plan-policy.sh, taking a root as its
        # argument, and it needs the read-only plan role from task 1.0 in vars.AWS_PLAN_ROLE_ARN.
        #
        # Two of these plans carry credentials: the identity root's holds every generated test-user
        # password and the apps root's holds the OAuth client secrets, because a plan's `after` is
        # what the apply will write. So the plan reaches the checker inside this job and never
        # leaves it (change request 1.1). Task 1.9 must review this future shape end to end:
        #
        #   terraform -chdir="$root" plan -out="$RUNNER_TEMP/plan.tfplan" ...
        #   terraform -chdir="$root" show -json "$RUNNER_TEMP/plan.tfplan" \
        #     | tools/scripts/plan-policy.sh "$root"
        #
        # $RUNNER_TEMP is outside the checkout and goes with the runner. Never `-out=` a relative
        # path, never redirect the JSON into the workspace, and never upload either as an artifact:
        # an uploaded plan is a credential in the Actions retention store for anyone who can read
        # the run. The guard currently refuses plan/show altogether: it is not a shell sandbox.
        # Task 1.9 must also check consumer diagnostics and every upload/cache before enabling it.
        run: |
          set -euo pipefail
          if [ ! -x tools/scripts/plan-policy.sh ]; then
            echo "::notice::P-01 to P-03 not checked: tools/scripts/plan-policy.sh does not exist yet (task 1.9)."
            exit 0
          fi
          if [ -z "${AWS_PLAN_ROLE_ARN}" ]; then
            echo "::notice::P-01 to P-03 not checked: vars.AWS_PLAN_ROLE_ARN is not set (task 1.0 creates the role)."
            exit 0
          fi
          echo "::error::plan-policy.sh exists and the role is set, but task I-5 left no step to run them."
          exit 1
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
