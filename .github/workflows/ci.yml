# CI. Owner: integrator, written at task I-5.
#
# Four jobs. The documents job runs on every pull request and costs a few minutes: the documents a
# session steers by, the roadmap, the checks' own tests, the test companions of tools/land.sh, of
# the review record reader it runs, of the local check, tools/check.sh, of tools/preflight.sh, of
# the branch cleanup land.sh runs and of the main-checkout guard, the test companions of the cell
# scripts under tools/scripts/ (tunnel.sh and verify-tunnel.sh, seed.sh, deploy.sh, rollback.sh,
# teardown.sh and verify-release-immutability.sh), whether every tracked shell script parses, and --
# first, so the two expensive jobs can read the answer -- which halves of the repository the change
# touches. Those two run when their inputs changed: the solution builds and every test project runs
# for build inputs, and the Terraform roots validate, at the floor .terraform-version names, for
# infra/ and the floor's own file and helper. The hook shares these path patterns
# through .github/touches.sh. CI's decision step also runs both jobs for changes to its workflow,
# the classifier, tools/smoke.sh or tools/image-check.sh, or when the base cannot be resolved.
#
# A job skipped that way still satisfies main's protection, which requires `Build and test` and
# `Terraform` by name: GitHub reports a job skipped by its `if` as a success, where a workflow
# skipped by an `on.paths` filter leaves the required check pending and the pull request stuck --
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks
# -- which is why the filter is an `if` on each job and not a `paths` on the workflow. Each `if`
# says `!cancelled()` rather than the implied success(): if the documents job failed before it could
# answer, both expensive jobs run, because a skipped check has to be earned by a diff that proves it
# unnecessary.
#
# Check A-05 is deliberately not here. It lives in tools/check.sh, which .githooks/pre-push runs,
# where it catches a session that reached outside its brief at the moment it reached. A blocking CI check would need an
# override for the integrator's own cross-owner work, and an override nobody can verify -- one
# author, one reviewer -- is a permissions model for a team of one.
#
# The fourth job runs the shell scripts' test companions, six of the cell scripts' among them, and the
# parse check again on macOS, under the bash 3.2 the scripts target, and the main-checkout guard's
# companion on macOS, where the sessions here run the hook, on every push and pull request; the
# steps that run them say why.
#
# Plan policy (P-01 to P-03 and P-07) is mock-provider assertions that the Terraform job's test step
# runs (ADR-0016); CI holds no AWS credential, and plan generation stays disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Documents
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The steering check asks GitHub which issue and pull request numbers exist, with this job's
      # token. The repository is public, so a token with neither scope could read them today; they
      # are granted so the check keeps working on the day that changes.
      issues: read
      pull-requests: read
    outputs:
      build: ${{ steps.touches.outputs.build }}
      terraform: ${{ steps.touches.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag. The roadmap check below derives how far the work has
          # got from the tags and the merge subjects, the diff below needs the base to be here, and
          # the default depth-1 checkout has neither.
          fetch-depth: 0

      - name: Which halves of the repository this change touches
        id: touches
        # Against the base of the pull request, or the commit a push to main moved from, in the
        # three-dot form the hook uses, so the diff is what the change adds and not what main did
        # meanwhile. The two jobs below read the answer. Every job runs when there is no base to
        # diff against -- a push whose `before` GitHub does not have -- and when the files that make
        # this decision changed: this workflow, .github/touches.sh, or tools/smoke.sh and
        # tools/image-check.sh, which only the build job exercises. A decision cannot vouch for a
        # change to itself. The base it resolved is an output too, empty when there was none, for
        # the steering check's authority rule, which judges the commits from it to HEAD: one place
        # decides the range, not two.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            *) base="$BEFORE" ;;
          esac
          build=true
          terraform=true
          resolved=""
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            echo "::notice::no base to diff against ($base), so every job runs."
          else
            resolved="$base"
            changed="$(git diff --name-only "$base"...HEAD)"
            # Consume all paths so pipefail cannot turn an early match into a SIGPIPE failure.
            if printf '%s\n' "$changed" | grep -E '^\.github/(workflows/ci\.yml|touches\.sh)$|^tools/(smoke|image-check)\.sh$' > /dev/null; then
              echo "::notice::the workflow, the halves, the smoke test or the image check changed, so every job runs."
            else
              printf '%s\n' "$changed" | .github/touches.sh build || build=false
              printf '%s\n' "$changed" | .github/touches.sh terraform || terraform=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "base=$resolved" >> "$GITHUB_OUTPUT"
          echo "build=$build terraform=$terraform"

      - name: CI path decisions include build inputs and survive large diffs
        run: python3 -I .github/touches_tests.py

      - name: Every tracked shell script parses
        # A script that does not parse fails here, at the push that broke it, rather than in whatever
        # runs it next: tools/check.sh is run as written by the hook, by a person before a push and
        # by every overnight lane, so a syntax error there stops all of them at once (#68). The
        # companion first breaks copies of this repository's own scripts and watches the check
        # refuse them, because a check that has only ever seen clean scripts cannot show it reads any.
        run: |
          python3 -I .github/shell_parse_tests.py
          python3 -I .github/shell-parse.py

      - name: Every workflow script parses
        # The Workflow tool wraps a script's body in an async function, so the file begins with
        # `export const meta` and returns at its top level. The check rewrites the metadata export,
        # wraps the body in a function it never calls, and parses a .cjs copy to force CommonJS;
        # an ambiguous .js copy can hide syntax errors behind module detection on Node 22.
        # A syntax error fails at the push that broke it rather than at the launch that would
        # have run it (ADR-0026, #135).
        # The node is the one this image ships, printed here beside the result; the macOS job does
        # not run this step (docs/dependencies.md).
        run: |
          node --version
          python3 -I .github/workflow_parse_tests.py
          python3 -I .github/workflow-parse.py

      - name: The overnight script schedules its lanes as its test companion says
        # .claude/workflows/overnight_tests.mjs runs overnight.js end to end with every agent mocked,
        # on the tracked fixture of 2026-10-20, and checks what integrates, what skips for a blocker,
        # and that a lane runs its first ready ticket rather than idling behind a blocked one. It is
        # the script's only behavioural proof, so a scheduler edit fails at its push, before the
        # launch it is for (ADR-0027, #213). It runs on every push with no path condition, like every
        # step in this job, and takes about a second on the node the step above printed. It is
        # wall-clock timed (a 1 ms tick against sleeps of 30 to 180 ms); a virtual clock comes only
        # if it ever flakes here. tools/check.sh does not run it: CI on the landing pull request is
        # what proves a scheduler edit before its launch (ADR-0026 decision 3).
        run: node .claude/workflows/overnight_tests.mjs

      - name: What a session steers by says what the repository says, every citation resolves, and every change to it names its authority
        # Before anything else, because it costs a second and a stale AGENTS.md misleads every
        # session from the top of its context window. Every rule it holds was prose first, and prose
        # let a progress line sit directly under the paragraph forbidding it for two sessions running.
        # It covers the two steering files; the contracts index, whose freeze column makes a claim
        # about a file two directories away; the ticket citations in every tracked file, each of
        # which claims that a number resolves to a spec somebody can open; the tickets in each
        # tracker directory, where two files sharing a number leave a citation of it ambiguous; and
        # the issue citations in every tracked file, each of which claims a number GitHub has issued
        # to an issue or pull request here, which the check asks GitHub about with the token below;
        # and the commits this change adds, each of which, if it changes a steering document, must
        # name what authorised it in an `Authority:` trailer (ADR-0023, #102). Those are judged from
        # the base the decision step resolved, or over every commit HEAD reaches when it resolved
        # none, so a push GitHub has no `before` for is judged rather than skipped.
        # The tests run first, on trees built to trip each rule, because the repository is green and
        # a green repository cannot show that a widened check stopped catching what it was for.
        env:
          # For `gh api`, which the check runs once to list the issue and pull request numbers, and
          # once per comment an `Authority:` trailer cites.
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.touches.outputs.base }}
        run: |
          python3 -I .github/steering_tests.py
          if [ -n "$BASE" ]; then
            python3 -I .github/steering.py --base "$BASE"
          else
            python3 -I .github/steering.py
          fi

      - name: Plan generation stays disabled until its private pipeline is reviewed
        # A plan's `after` holds the values the apply will write, so the identity root's plan
        # carries every generated test-user password and the apps root's carries the OAuth client
        # secrets. Change request 1.1's first half put *.tfplan in .gitignore; this is its second
        # half, and it is a check rather than a sentence because the sentence is what the author of
        # any future plan pipeline would read last. It starts green: nothing here uploads an
        # artifact or writes a plan yet.
        run: |
          python3 -I .github/plan-secrecy-tests.py
          python3 -I .github/plan-secrecy.py

      - name: The roadmap says what the tags, the merges and the plan say
        # docs/roadmap.md carries the gateway's capability ladder and a generated block saying how
        # far along it the work has got. The block is derived, and this is what keeps it derived: it
        # fails when the block is not what the repository says, and when the ladder stops covering
        # every plan row exactly once. Beside the steering check for the same reason -- a document
        # that states progress is a document that will state it wrongly.
        run: |
          python3 -I tools/roadmap_tests.py
          python3 -I tools/roadmap.py --check

      - name: A-05's two rules hold
        # The ownership check is the one guard with no CI job of its own: it runs in the pre-push
        # hook, where a failure costs an amended commit instead of a red pull request. Its rules
        # are still worth a test, because the second one -- every commit single-owner, on a branch
        # that merged something -- is the rule that decides whether an integration branch can be
        # pushed through the hook at all rather than around it.
        run: python3 -I .github/path_ownership_tests.py

      - name: The review record reader clears only the head a record names
        # tools/land.sh merges only a head whose latest review record says merge, and this is the
        # code that decides it (#67). Its companion feeds it GitHub's shapes of comments and reviews
        # built to trip each rule -- a hold, an earlier head, an abbreviated or malformed line, a sha
        # in passing, a review's own commit_id, a line from outside the repository -- because a
        # guard nobody has seen refuse is a decoration, and the land.sh companion below runs only one
        # case of each.
        run: python3 -I tools/review_record_tests.py

      - name: The retro's record reader reads each record line the way its rules say
        # The retro workflow (#77) files tickets from what tools/retro_record.py decides a record line
        # is: a check log's verdict, a side log, an earlier round, a report's date, the noun merge, cost
        # times recurrence, coverage and a ticket body's shape (#260). Its companion builds each shape to
        # trip one rule, a RED log beside a GREEN one and a body without its owner line beside one with
        # it, because a reader that read RED as GREEN would file nothing and look clean.
        run: python3 -I tools/retro_record_tests.py

      - name: The pins inventory classifies each pin the way its rules say, and renders the same table twice
        # The pins sweep (#82) files its issues and the standing report's table from what
        # tools/pins_inventory.py decides a pin is: its family, the projects that reference it, the
        # documents and evidence that name its version, its advisories, a decision's hold, and its
        # status by precedence (#269). Its companion builds each shape against throwaway copies of this
        # checkout's pins file and project files, with every network input supplied from a file, because
        # a classifier that read an advisory as current would leave the one warning nobody reads as the
        # only place it appears.
        run: python3 -I tools/pins_inventory_tests.py

      - name: The companions' runner reports every case it runs, each in its suite's order
        # tools/land_tests.py, tools/check_tests.py and tools/prune_branches_tests.py run their cases
        # at the same time through tools/companion_runner.py (#107), so a failure the runner lost
        # would turn all three green at once. Its companion runs throwaway cases built to trip each
        # rule through it -- a failure, an error, a failing subTest, a case that must run after the
        # others, a module fixture that raises -- under unittest's own runner, not the one it tests.
        run: python3 -I tools/companion_runner_tests.py

      - name: tools/land.sh refuses before it merges, merges only a reviewed head with the body its caller named, and pushes the roadmap's refresh alone
        # tools/land.sh is the one sanctioned merge path, and it once checked a relative body path
        # in one directory and read it from another (2c9962f), which a copy of its parse loop had
        # verified. The companion runs the real script against real git in throwaway repositories,
        # the real review record reader and a gh double, so no case reaches GitHub. Most cases stop
        # at the merge, which their double fails. The cases past it (#97) have a double that merges
        # into the bare origin as GitHub would, and the real tools/roadmap.py, and see the
        # fast-forward refusal, the exit when the blocks did not move, and the refresh pushed with
        # nothing else in it. Here it runs under the runner's bash 5, which the script's shebang can
        # also pick; the bash 3.2 job runs it at the other end of that range. The tool choice is D-3
        # in docs/dependencies.md.
        run: python3 -I tools/land_tests.py

      - name: tools/check.sh runs the hook's checks unchanged, and in full ends on its verdict
        # The local check is what .githooks/pre-push runs, what a person runs before a push and what
        # every overnight lane runs in full (#68). Its companion runs the real hook and the real script
        # in throwaway repositories, with doubles for the Python checks, dotnet, terraform and the
        # smoke test, and asserts the hook's lines as they were before the checks moved, and that the
        # full mode's last line is its verdict whichever step stops it. Under bash 5 here; the job below
        # runs it under 3.2.
        run: python3 -I tools/check_tests.py

      - name: tools/preflight.sh holds the AWS credentials to the project its file names, and counts what day one needs
        # Preflight is where tools/land.sh sends a reader without gh, and its AWS project guard is
        # what stands between an apply and the wrong project (7a364fe). Its companion runs a
        # whole-file copy of the script beside crafted env files, with doubles for aws, terraform,
        # git, dotnet, openssl, gh and python3 and no curl, so no case reaches the network or AWS.
        # It covers each form of the env file against what `set -a; .` makes of it, the nine guard
        # cases, the profile's configured Region and the account pin, an exported CDPATH, the gh and
        # python3 rows (#96), and the Terraform floor's rows (#69). Under bash 5 here; the job below
        # runs it under 3.2.
        run: python3 -I tools/preflight_tests.py

      - name: A landing deletes the branches it finished, and keeps and lists every other
        # tools/prune_branches.py deletes branches, locally and on origin, and a deleted branch with
        # work on it is work lost, so every rule that keeps one is held here (#71): a claim of a row
        # the roadmap does not call landed, a worktree, commits or a merge resolution main lacks, and
        # a push to origin after the check. Its companion runs the real script against real git in
        # throwaway repositories, with a bare origin and a gh double, and runs tools/land.sh past a
        # merge to see the landing delete what it finished. tools/land_tests.py covers the steps
        # between that merge and the cleanup, and answers the cleanup with a double.
        run: python3 -I tools/prune_branches_tests.py

      - name: The main-checkout guard refuses branch work in the main checkout, and nothing else
        # The tracked .claude/settings.json runs tools/main_checkout_guard.py before each Bash call
        # of a Claude Code session started in a checkout that holds it, and it refuses the
        # branch-moving git commands in this repository's main checkout, which concurrent sessions
        # share (#114). A guard that refuses too little lets one session rebase another's branch;
        # one that refuses too much stops every session's work. Its companion feeds the real hook
        # each case's tool input against real git in a throwaway repository with a linked
        # worktree, and runs the settings entry as written.
        run: python3 -I tools/main_checkout_guard_tests.py

      - name: The overnight collect resolves tickets by its rules, lists specs apart and refuses a shared id
        # The overnight run's lanes are built from what tools/overnight_collect.py resolves (#187):
        # ids, owners, open blockers, status, open boxes and order, with a spec listed as a parent
        # and two tickets sharing an id refused rather than one overwriting the other. Its companion
        # has a case for each rule, on hand-built listings. It reads GitHub through a gh double on
        # PATH in an environment that inherits nothing, so no case reaches a real repository, and
        # reads the task branches, local and on origin, from real git in a throwaway clone.
        run: python3 -I tools/overnight_collect_tests.py

      - name: An image build sends no secret or host build output, and the runtime user can read the image
        # A workstation's image build sent the local CA's private key, the scratch directory and
        # its own bin/ and obj/ to the builder, and the gateway it built could not read its own
        # appsettings.json as $APP_UID (#204). A clean checkout like this runner's shows neither.
        # The companion holds the root .dockerignore to Docker's matching rules over a path for each
        # thing it must keep out and over every tracked file a Dockerfile copies, asks git whether
        # the outputs document is ignored, and runs each Dockerfile's post-publish steps over an
        # owner-only tree. It needs no Docker.
        run: python3 -I tools/image_build_tests.py

      - name: tunnel.sh and verify-tunnel.sh reach the ALB through the gateway task, and refuse TLS the workstation does not trust
        # The cell scripts under tools/scripts/ are workstream 1's, and six of their companions run
        # here because neither half in .github/touches.sh covers that directory, so this job is the
        # one that sees a change to them (change requests 1.6b, 1.7 and issue-122, decided on #226).
        # certs_tests.py, logs_tests.py and cell_doubles_tests.py run under tools/check.sh --full and
        # in no job here. This companion runs
        # the real scripts with doubles for aws, session-manager-plugin and curl, and the real curl
        # against two loopback listeners, one with nothing on it and one whose certificate no trust
        # store holds, so no case reaches AWS. Under bash 5 here; the job below runs it under 3.2.
        run: python3 -I tools/scripts/tunnel_tests.py

      - name: seed.sh writes the outputs document, publishes the fixture releases and writes the first registry
        # Change request 1.7, decided on #226. seed.sh, deploy.sh, rollback.sh and teardown.sh share
        # the doubles in tools/scripts/cell_doubles.py: aws, terraform, docker and dotnet, so no case
        # reaches AWS, Docker or NuGet, and every run's output is searched for the doubles' canaries.
        # Under bash 5 here; the job below runs it under 3.2.
        run: python3 -I tools/scripts/seed_tests.py

      - name: deploy.sh builds and pushes the images, applies their digests and checks the running gateway is the one pushed
        # Change request 1.7. The shared doubles as above. Under bash 5 here; the job below runs it
        # under 3.2.
        run: python3 -I tools/scripts/deploy_tests.py

      - name: rollback.sh puts the previous gateway back and checks it is the one running
        # Change request 1.7. The shared doubles as above. Under bash 5 here; the job below runs it
        # under 3.2.
        run: python3 -I tools/scripts/rollback_tests.py

      - name: teardown.sh destroys the three roots in reverse order and proves nothing tagged is left
        # Change request 1.7. The shared doubles as above. Under bash 5 here; the job below runs it
        # under 3.2.
        run: python3 -I tools/scripts/teardown_tests.py

      - name: verify-release-immutability.sh runs P-04's cases against the platform bucket one line each
        # Change request issue-122, decided with 1.6b and 1.7 on #226. Doubles for aws, terraform and
        # date, the doubled AWS keeping each case's bucket, policy, repositories and teardown role in
        # a file, so no case reaches AWS. The slowest of the cell companions, about a minute and a
        # half on a Mac. Under bash 5 here; the job below runs it under 3.2.
        run: python3 -I tools/scripts/verify_release_immutability_tests.py

  scripts-bash-3-2:
    name: Scripts under bash 3.2
    runs-on: macos-latest
    # The companion's gh is a double and nothing here reaches AWS, so no token beyond reading the
    # repository, and no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The companions' runner, on macOS
        # The companions below run through it here as well, under the Python this image ships, where
        # the documents job runs another.
        run: python3 -I tools/companion_runner_tests.py

      - name: tools/land.sh before, at and after its merge, under the bash 3.2 macOS ships
        # The Linux runner has bash 5, so it can never show a failure only 3.2 has: under set -u,
        # 3.2 calls an empty "${array[@]}" an unbound variable where 5 expands it to nothing. The
        # variable makes the companion fail, not skip, when /bin/bash is not 3.2, which is why
        # this is macos-latest and not a pinned image: an image that changes the shell turns the
        # job red rather than quietly testing bash 5. Free while the repository is public (D-3).
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/land_tests.py

      - name: tools/check.sh and the hook, under the bash 3.2 macOS ships
        # The same reason as the step above, for the local check: it is written for 3.2 because the
        # pre-push hook and every overnight lane on this Mac run it there.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/check_tests.py

      - name: tools/preflight.sh, under the bash 3.2 macOS ships
        # Preflight is written for the bash 3.2 macOS ships, which is what a person on a Mac runs.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/preflight_tests.py

      - name: The cleanup tools/land.sh runs after its merge, under the bash 3.2 macOS ships
        # tools/land_tests.py answers the cleanup with a double, so only this companion runs the
        # real one past a merge, and a landing on this Mac runs it under 3.2.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/prune_branches_tests.py

      - name: tunnel.sh and verify-tunnel.sh, under the bash 3.2 macOS ships
        # A sitting runs the tunnel from this Mac, under 3.2 (change request 1.6b).
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/tunnel_tests.py

      - name: seed.sh, under the bash 3.2 macOS ships
        # The deployment scripts run from this Mac, under 3.2 (change request 1.7).
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/seed_tests.py

      - name: deploy.sh, under the bash 3.2 macOS ships
        # Change request 1.7, as the step above.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/deploy_tests.py

      - name: rollback.sh, under the bash 3.2 macOS ships
        # Change request 1.7, as the step above.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/rollback_tests.py

      - name: teardown.sh, under the bash 3.2 macOS ships
        # Change request 1.7, as the step above.
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/teardown_tests.py

      - name: verify-release-immutability.sh, under the bash 3.2 macOS ships
        # P-04 is checked from this Mac against the applied bucket, under 3.2 (change request
        # issue-122).
        env:
          SCRIPT_TESTS_REQUIRE_BASH: "3.2"
        run: python3 -I tools/scripts/verify_release_immutability_tests.py

      - name: Every tracked shell script parses under bash 3.2
        # The parse check reads with /bin/bash, which here is 3.2, so syntax only bash 5 accepts fails
        # here even though the documents job, under bash 5, passed it.
        run: python3 -I .github/shell-parse.py

      - name: The main-checkout guard, on macOS
        # The sessions here run the hook on a Mac, through its /bin/sh and the git first on its PATH,
        # where the documents job runs it on Linux. One way the two differ: the companion's
        # temporary directory sits behind a symbolic link on macOS (/var is /private/var), and the
        # guard has to compare the paths git resolves, not the ones a command names.
        run: python3 -I tools/main_checkout_guard_tests.py

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: documents
    # Only when the .NET half changed; the header says why this is an `if` and why it says
    # `!cancelled()`.
    if: ${{ !cancelled() && needs.documents.outputs.build != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The SDK and the runtimes the test hosts load
        # The test hosts run on the SDK's shared framework, not the gateway image's, so a patch in one
        # is not a patch in the other. This reads them the way a workstation reads its own, and the way
        # tools/image-check.sh reads the image's (#273). Informational: no version fails it.
        run: dotnet --version && dotnet --list-runtimes

      # Package versions are central, so one key covers the whole solution.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        # Warnings are errors, set in Directory.Build.props. Package advisories warn (NU1901-NU1904).
        run: dotnet build --configuration Release

      - name: Tests
        # Every test project in the solution: the component tests, the hermetic gateway suites and
        # the architecture tests A-01 to A-04. They are one step because the whole suite runs in
        # seconds; split it per tier when workstream 6's suites make that worth separate signal.
        #
        # A test project with no tests exits 8 on Microsoft Testing Platform. On the skeleton most of
        # them have none, so 8 is suppressed. It stops being suppressed when it stops being normal.
        #
        # --no-build: the Build step above already built Release, and a second evaluation buys nothing.
        run: dotnet test --solution SpaPlatform.slnx --configuration Release --no-build --ignore-exit-code 8

      - name: The gateway starts and answers 404 to an unknown host
        # G1a's exit test, and nothing else here proves it: the suite never starts the gateway, so a
        # composition root that throws, or a settings file the configuration binder rejects, builds
        # and tests clean. Both have happened.
        #
        # The script holds the probes, so a local run and this one are the same test.
        run: tools/smoke.sh Release 5080

      - name: The gateway image builds from a workstation's tree and starts as its runtime user
        # The first deployment found what this runner's clean checkout cannot show: a host obj/ in
        # the image's build context, and a file only its owner can read, which kills the gateway in
        # WebApplication.CreateBuilder as $APP_UID (#58, #204). The script plants both in a copy of
        # the tree, builds src/Gateway/Dockerfile without pushing, and starts the image as its own
        # user (#210). The runner's Docker builds for its own architecture; the script says why.
        run: tools/image-check.sh

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: documents
    # Only when infra/ or the floor changed; the header says why this is an `if` and why it says `!cancelled()`.
    if: ${{ !cancelled() && needs.documents.outputs.terraform != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: The floor .terraform-version names
        id: terraform-floor
        # The floor is the oldest Terraform the repository supports, and this job runs exactly it.
        # One file names it and tools/check.sh reads the same file through the same function, so a
        # result on a machine that has the floor holds here, and raising the floor is a one-line
        # change (#69). The reader refuses anything but one exact version: setup-terraform takes a
        # range or `latest` too (https://github.com/hashicorp/setup-terraform/blob/v3/action.yml),
        # and would install the newest release that matched.
        run: |
          set -euo pipefail
          . tools/terraform-floor.sh
          if ! version="$(terraform_floor_read .terraform-version)"; then
            echo "::error::.terraform-version does not name one exact version, such as 1.11.0."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the floor is Terraform $version"

      - uses: hashicorp/setup-terraform@v3
        with:
          # The S3 backend's native lock file, which is why no DynamoDB table exists anywhere in
          # this platform, first shipped in 1.10.0 and became generally available in 1.11.0, which
          # is the floor: https://github.com/hashicorp/terraform/blob/v1.11.0/CHANGELOG.md
          terraform_version: ${{ steps.terraform-floor.outputs.version }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Validate every root
        # A root is any directory holding .tf files. Discovered rather than listed, so the roots
        # tasks 1.1 to 1.5 and 1.8 add are validated the day they land.
        #
        # -backend=false: validation needs no state and no credentials.
        run: |
          set -euo pipefail
          roots=$(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$roots" ]; then
            echo "::error::no Terraform roots found under infra/"
            exit 1
          fi
          for root in $roots; do
            echo "--- $root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Test every root and module with tests under infra/
        # Terraform loads *.tftest.hcl beside the configuration or in its tests/ directory:
        # https://developer.hashicorp.com/terraform/language/tests#test-directory
        # These tests use mock providers, so they need no credentials. Without this step those
        # runs are evidence from whichever machine wrote them.
        run: |
          set -euo pipefail
          dirs=$(find infra -type f -name '*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; \
            | while IFS= read -r parent; do
                if [ "$(basename "$parent")" = tests ]; then
                  dirname "$parent"
                else
                  printf '%s\n' "$parent"
                fi
              done | sort -u)
          if [ -z "$dirs" ]; then
            echo "::error::no Terraform test roots found under infra/"
            exit 1
          fi
          while IFS= read -r dir; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
          done <<< "$dirs"
